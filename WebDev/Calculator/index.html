<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Calculator UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="index.js"></script>

    <div class="calculator">
        <div class="top-bar"><b>Calculator</b>
            <span class="icon-resize">&#8601;</span>
            <div class="right-icons">
                <span class="icon-math">&radic;&pi;<br>e=</span>
                <span class="icon-grid">&#8862;</span>
                <span class="icon-menu">&#8942;</span>
            </div>
        </div>

        <input type="text" class="display" value="" placeholder="0" readonly>

        <div class="keypad">
            <button class="btn">AC</button>
            <button class="btn">%</button>
            <button class="btn">Del</button> <button class="btn">&divide;</button>
            
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn">&times;</button>
            
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="btn">&minus;</button>
            
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn">+</button>
            
            <button class="btn">00</button>
            <button class="btn">0</button>
            <button class="btn">.</button>
            <button class="btn equals">=</button>
        </div>
    </div>

</body>
</html>
