<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Quiz App</title>
    <style>
        /* CSS: Styling the App */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .app-container {
            background: white;
            width: 90%;
            max-width: 600px;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }
        h2 {
            color: #222;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .btn {
            background: #fff;
            color: #333;
            border: 2px solid #e0e0e0;
            padding: 12px 20px;
            margin: 8px 0;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: all 0.2s;
        }
        .btn:hover:not(:disabled) {
            background: #f8f9fa;
            border-color: #007bff;
        }
        .btn:disabled {
            cursor: not-allowed;
        }
        /* Colors for correct/incorrect answers */
        .correct {
            background: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
        }
        .incorrect {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }
        #next-btn {
            background: #007bff;
            color: white;
            border: none;
            font-weight: bold;
            text-align: center;
            display: none; /* Hidden until an answer is clicked */
            margin-top: 20px;
        }
        #next-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h1><b>Quiz Time !</b></h1>
        <div id="quiz">
            <h2 id="question">Question goes here</h2>
            <div id="answer-buttons">
                <!-- Buttons will be injected here by JavaScript -->
            </div>
            <button id="next-btn" class="btn">Next Question</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                question: "Aap kya ho?",
                answers: [
                    { text: "Hyper Text Preprocessor", correct: false },
                    { text: "Hyper Text Markup Language", correct: true },
                    { text: "Hyper Text Multiple Language", correct: false },
                    { text: "Hyper Tool Multi Language", correct: false }
                ]
            },
            {
                question: "Kya  apke pass h ?",
                answers: [
                    { text: "Male", correct: false },
                    { text: "Female", correct: false },
                    { text: "Chakka", correct: false },
                    { text: "Hijda", correct: true }
                ]
            },
            {
                question: "Kya aap muh m loge?",
                answers: [
                    { text: "Cascading Style Sheets", correct: true },
                    { text: "Colorful Style Sheets", correct: false },
                    { text: "Computer Style Sheets", correct: false },
                    { text: "Creative Style Sheets", correct: false }
                ]
            },
            {
                question: "Kaisi Kaisi Ph ?",
                answers: [
                    { text: " Red", correct: false},
                    { text: " Green", correct: false},
                    { text: " Blue", correct: false},
                    { text: " Black", correct: true}

                ]
            }
        ];

      
        const questionElement = document.getElementById("question");
        const answerButtonsElement = document.getElementById("answer-buttons");
        const nextButton = document.getElementById("next-btn");

        let currentQuestionIndex = 0;
        let score = 0;

       
        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            nextButton.innerHTML = "Next Question";
            showQuestion();
        }

        
        function showQuestion() {
            resetState();
            let currentQuestion = questions[currentQuestionIndex];
            questionElement.innerHTML = `${currentQuestionIndex + 1}. ${currentQuestion.question}`;

            currentQuestion.answers.forEach(answer => {
                const button = document.createElement("button");
                button.innerHTML = answer.text;
                button.classList.add("btn");
                if (answer.correct) {
                    button.dataset.correct = answer.correct; // Tag the correct answer
                }
                button.addEventListener("click", selectAnswer);
                answerButtonsElement.appendChild(button);
            });
        }

        
        function resetState() {
            nextButton.style.display = "none";
            while (answerButtonsElement.firstChild) {
                answerButtonsElement.removeChild(answerButtonsElement.firstChild);
            }
        }

      
        function selectAnswer(e) {
            const selectedButton = e.target;
            const isCorrect = selectedButton.dataset.correct === "true";
            
            if (isCorrect) {
                selectedButton.classList.add("correct");
                score++;
            } else {
                selectedButton.classList.add("incorrect");
            }

           
            Array.from(answerButtonsElement.children).forEach(button => {
                if (button.dataset.correct === "true") {
                    button.classList.add("correct");
                }
                button.disabled = true;
            });
            
           
            nextButton.style.display = "block";
        }

        // 7. Show final score
        function showScore() {
            resetState();
            questionElement.innerHTML = `You scored ${score} out of ${questions.length}!`;
            nextButton.innerHTML = "Play Again";
            nextButton.style.display = "block";
        }

        function handleNextButton() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showScore();
            }
        }

        nextButton.addEventListener("click", () => {
            if (currentQuestionIndex < questions.length) {
                handleNextButton();
            } else {
                startQuiz();
            }
        });

        // Initialize the app
        startQuiz();
    </script>
</body>
</html>
