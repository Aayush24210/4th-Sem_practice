<!-- space shooter game -->
 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Shooter</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;                                                      
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Orbitron', monospace;
    overflow: hidden;
  }

  #gameWrapper {
    position: relative;
    width: 480px;
    height: 640px;
  }

  canvas {
    display: block;
    border: 1px solid #0ff3;
    box-shadow: 0 0 40px #0ff2, 0 0 80px #00f1;
  }

  /* HUD overlays */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 14px 18px;
    pointer-events: none;
    z-index: 10;
  }

  .hud-val {
    color: #0ff;
    font-size: 13px;
    letter-spacing: 2px;
    text-shadow: 0 0 8px #0ff;
  }

  .hud-label {
    color: #0ff6;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* Lives */
  #livesBox { display: flex; gap: 6px; align-items: center; }
  .life-icon { color: #f55; font-size: 14px; text-shadow: 0 0 6px #f55; }

  /* Screens */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 18px;
    background: rgba(0,0,0,0.82);
    z-index: 20;
  }

  .screen h1 {
    font-size: 36px;
    font-weight: 900; 
    color: #0ff;
    text-shadow: 0 0 20px #0ff, 0 0 40px #00f;
    letter-spacing: 4px;
  }

  .screen p {
    color: #aef;
    font-size: 11px;
    letter-spacing: 3px;
    text-align: center;
    line-height: 2;
  }

  .btn {
    margin-top: 10px;
    padding: 12px 36px;
    background: transparent;
    border: 2px solid #0ff;
    color: #0ff;
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    cursor: pointer;
    text-shadow: 0 0 8px #0ff;
    box-shadow: 0 0 14px #0ff4;
    transition: all 0.2s;
  }

  .btn:hover {
    background: #0ff2;
    box-shadow: 0 0 28px #0ff8;
  }

  .score-big {
    font-size: 48px;
    color: #ff0;
    text-shadow: 0 0 20px #ff0;
  }

  #startScreen .subtitle {
    font-size: 10px;
    color: #0ff8;
    letter-spacing: 5px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="c" width="480" height="640"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div>
      <div class="hud-label">Score</div>
      <div class="hud-val" id="scoreDisplay">0</div>
    </div>
    <div style="text-align:center">
      <div class="hud-label">Level</div>
      <div class="hud-val" id="levelDisplay">1</div>
    </div>
    <div style="text-align:right">
      <div class="hud-label">Lives</div>
      <div id="livesBox"></div>
    </div>
  </div>

  <!-- Start Screen -->
  <div class="screen" id="startScreen">
    <h1>NOVA<br>STRIKE</h1>
    <p class="subtitle">SPACE SHOOTER</p>
    <p>← → MOVE &nbsp;|&nbsp; SPACE SHOOT<br>Survive the alien onslaught</p>
    <button class="btn" onclick="startGame()">LAUNCH</button>
  </div>

  <!-- Game Over Screen -->
  <div class="screen hidden" id="gameOverScreen">
    <h1>GAME<br>OVER</h1>
    <div class="score-big" id="finalScore">0</div>
    <p>FINAL SCORE</p>
    <button class="btn" onclick="startGame()">RETRY</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── State ──────────────────────────────────────────────
let player, bullets, enemies, particles, stars;
let score, lives, level, gameRunning, frame;
let keys = {};
let shootCooldown = 0;
let enemySpawnTimer = 0;
let bossActive = false, boss = null;

// ── Stars background ───────────────────────────────────
function makeStars() {
  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.3,
      speed: Math.random() * 0.8 + 0.2,
      a: Math.random()
    });
  }
}

// ── Particle ───────────────────────────────────────────
function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1, decay: Math.random() * 0.04 + 0.02,
      r: Math.random() * 3 + 1,
      color
    });
  }
}

// ── Init ───────────────────────────────────────────────
function startGame() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');

  player = { x: W / 2, y: H - 80, w: 36, h: 36, speed: 5 };
  bullets   = [];
  enemies   = [];
  particles = [];
  score     = 0;
  lives     = 3;
  level     = 1;
  frame     = 0;
  bossActive = false;
  boss       = null;
  shootCooldown  = 0;
  enemySpawnTimer = 0;
  gameRunning = true;

  makeStars();
  updateHUD();
  loop();
}

// ── Main Loop ──────────────────────────────────────────
function loop() {
  if (!gameRunning) return;
  frame++;
  update();
  draw();
  requestAnimationFrame(loop);
}

function update() {
  // Player movement
  if (keys['ArrowLeft']  || keys['a']) player.x = Math.max(player.w / 2, player.x - player.speed);
  if (keys['ArrowRight'] || keys['d']) player.x = Math.min(W - player.w / 2, player.x + player.speed);

  // Shooting
  if (shootCooldown > 0) shootCooldown--;
  if ((keys[' '] || keys['ArrowUp']) && shootCooldown === 0) {
    bullets.push({ x: player.x, y: player.y - 20, vy: -11, w: 4, h: 14, player: true });
    shootCooldown = 12;
  }

  // Stars scroll
  stars.forEach(s => { s.y += s.speed; if (s.y > H) s.y = 0; });

  // Spawn enemies
  enemySpawnTimer++;
  const spawnRate = Math.max(28, 60 - level * 4);
  if (enemySpawnTimer >= spawnRate && !bossActive) {
    enemySpawnTimer = 0;
    spawnEnemy();
  }

  // Boss every 500 score
  if (score > 0 && score % 500 === 0 && !bossActive) {
    spawnBoss();
  }

  // Move bullets
  bullets.forEach(b => b.y += b.vy);
  bullets = bullets.filter(b => b.y > -20 && b.y < H + 20);

  // Move enemies
  enemies.forEach(e => {
    e.y += e.vy;
    e.x += Math.sin(frame * 0.03 + e.phase) * e.wobble;
    // Enemy shoots
    if (e.shootTimer !== undefined) {
      e.shootTimer--;
      if (e.shootTimer <= 0) {
        bullets.push({ x: e.x, y: e.y + 20, vy: 4, w: 4, h: 10, player: false, color: '#f0f' });
        e.shootTimer = e.shootRate;
      }
    }
  });
  enemies = enemies.filter(e => e.y < H + 40);

  // Boss movement
  if (boss) {
    boss.x += boss.vx;
    if (boss.x < 60 || boss.x > W - 60) boss.vx *= -1;
    boss.y += Math.sin(frame * 0.02) * 0.5;
    boss.shootTimer--;
    if (boss.shootTimer <= 0) {
      // Triple shot
      for (let a of [-0.2, 0, 0.2]) {
        bullets.push({ x: boss.x, y: boss.y + 50, vy: 5, vx: Math.sin(a) * 3, w: 6, h: 14, player: false, color: '#f55' });
      }
      boss.shootTimer = boss.shootRate;
    }
  }

  // Collisions: player bullets → enemies / boss
  bullets.filter(b => b.player).forEach(b => {
    // vs enemies
    enemies.forEach(e => {
      if (hit(b, e)) {
        b.dead = true;
        e.hp--;
        spawnParticles(e.x, e.y, e.color, 6);
        if (e.hp <= 0) {
          e.dead = true;
          score += e.points;
          spawnParticles(e.x, e.y, e.color, 18);
          level = Math.floor(score / 200) + 1;
          updateHUD();
        }
      }
    });
    // vs boss
    if (boss && hit(b, boss)) {
      b.dead = true;
      boss.hp--;
      spawnParticles(boss.x + (Math.random()-0.5)*60, boss.y + (Math.random()-0.5)*40, '#f55', 5);
      if (boss.hp <= 0) {
        score += 300;
        spawnParticles(boss.x, boss.y, '#ff0', 40);
        boss = null;
        bossActive = false;
        updateHUD();
      }
    }
  });

  // Enemy bullets / enemies → player
  [...bullets.filter(b => !b.player), ...enemies].forEach(e => {
    if (hit(e, { x: player.x, y: player.y, w: 28, h: 28 })) {
      e.dead = true;
      lives--;
      spawnParticles(player.x, player.y, '#0ff', 20);
      updateHUD();
      if (lives <= 0) endGame();
    }
  });

  // Clean up
  bullets   = bullets.filter(b => !b.dead);
  enemies   = enemies.filter(e => !e.dead);
  particles = particles.filter(p => p.life > 0);

  // Update particles
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.93; p.vy *= 0.93;
    p.life -= p.decay;
  });
}

// ── Helpers ────────────────────────────────────────────
function hit(a, b) {
  const aw = (a.w || 20) / 2, bw = (b.w || 20) / 2;
  const ah = (a.h || 20) / 2, bh = (b.h || 20) / 2;
  return Math.abs(a.x - b.x) < aw + bw && Math.abs(a.y - b.y) < ah + bh;
}

function spawnEnemy() {
  const types = [
    { w:28, h:28, hp:1, vy:1.5+level*0.2, wobble:1.2, points:10, color:'#0ff',  shoot:false },
    { w:32, h:32, hp:2, vy:1.0+level*0.1, wobble:0.6, points:20, color:'#f0f',  shoot:true,  shootRate:90 },
    { w:22, h:22, hp:1, vy:2.5+level*0.2, wobble:2.0, points:15, color:'#ff0',  shoot:false },
  ];
  const t = types[Math.floor(Math.random() * types.length)];
  const e = {
    x: Math.random() * (W - 60) + 30,
    y: -30,
    phase: Math.random() * Math.PI * 2,
    ...t
  };
  if (e.shoot) { e.shootTimer = e.shootRate; }
  enemies.push(e);
}

function spawnBoss() {
  bossActive = true;
  boss = {
    x: W / 2, y: 100,
    w: 80, h: 60,
    hp: 30 + level * 5,
    maxHp: 30 + level * 5,
    vx: 1.5,
    shootTimer: 60,
    shootRate: 50
  };
}

function updateHUD() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('levelDisplay').textContent = level;
  const lb = document.getElementById('livesBox');
  lb.innerHTML = '';
  for (let i = 0; i < Math.max(0, lives); i++) {
    lb.innerHTML += '<span class="life-icon">♥</span>';
  }
}

function endGame() {
  gameRunning = false;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOverScreen').classList.remove('hidden');
}

// ── Draw ───────────────────────────────────────────────
function draw() {
  // Background
  ctx.fillStyle = '#000814';
  ctx.fillRect(0, 0, W, H);

  // Stars
  stars.forEach(s => {
    ctx.globalAlpha = s.a * 0.8 + 0.2;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Player bullets
  bullets.filter(b => b.player).forEach(b => {
    ctx.shadowBlur = 12; ctx.shadowColor = '#0ff';
    ctx.fillStyle = '#0ff';
    ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
    ctx.shadowBlur = 0;
  });

  // Enemy bullets
  bullets.filter(b => !b.player).forEach(b => {
    ctx.shadowBlur = 10; ctx.shadowColor = b.color || '#f0f';
    ctx.fillStyle = b.color || '#f0f';
    ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
    ctx.shadowBlur = 0;
  });

  // Enemies
  enemies.forEach(e => drawEnemy(e));

  // Boss
  if (boss) drawBoss(boss);

  // Player ship
  drawPlayer();
}

function drawPlayer() {
  const x = player.x, y = player.y;
  ctx.shadowBlur = 18; ctx.shadowColor = '#0ff';

  // Engine glow
  ctx.fillStyle = `rgba(0,200,255,${0.4 + Math.sin(frame * 0.2) * 0.2})`;
  ctx.fillRect(x - 10, y + 16, 7, 8 + Math.random() * 6);
  ctx.fillRect(x + 3,  y + 16, 7, 8 + Math.random() * 6);

  // Body
  ctx.fillStyle = '#0af';
  ctx.beginPath();
  ctx.moveTo(x, y - 20);
  ctx.lineTo(x - 16, y + 18);
  ctx.lineTo(x - 6, y + 10);
  ctx.lineTo(x + 6, y + 10);
  ctx.lineTo(x + 16, y + 18);
  ctx.closePath();
  ctx.fill();

  // Cockpit
  ctx.fillStyle = '#cff';
  ctx.beginPath();
  ctx.ellipse(x, y - 2, 5, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
}

function drawEnemy(e) {
  const x = e.x, y = e.y;
  ctx.shadowBlur = 14; ctx.shadowColor = e.color;
  ctx.fillStyle = e.color;

  if (e.color === '#ff0') {
    // Fast zigzag enemy — diamond
    ctx.beginPath();
    ctx.moveTo(x, y - 14);
    ctx.lineTo(x + 12, y);
    ctx.lineTo(x, y + 14);
    ctx.lineTo(x - 12, y);
    ctx.closePath();
    ctx.fill();
  } else if (e.color === '#f0f') {
    // Shooter — hexagon-ish
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
      i === 0 ? ctx.moveTo(x + Math.cos(a)*14, y + Math.sin(a)*14)
              : ctx.lineTo(x + Math.cos(a)*14, y + Math.sin(a)*14);
    }
    ctx.closePath();
    ctx.fill();
    // HP bar
    ctx.fillStyle = '#333';
    ctx.fillRect(x - 14, y + 16, 28, 3);
    ctx.fillStyle = '#f0f';
    ctx.fillRect(x - 14, y + 16, 28 * (e.hp / 2), 3);
  } else {
    // Basic — saucer
    ctx.beginPath();
    ctx.ellipse(x, y, 16, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff3';
    ctx.beginPath();
    ctx.ellipse(x, y - 3, 7, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function drawBoss(b) {
  const x = b.x, y = b.y;
  ctx.shadowBlur = 30; ctx.shadowColor = '#f55';

  // Body
  ctx.fillStyle = '#c22';
  ctx.beginPath();
  ctx.ellipse(x, y, 70, 40, 0, 0, Math.PI * 2);
  ctx.fill();

  // Wings
  ctx.fillStyle = '#a11';
  ctx.beginPath();
  ctx.moveTo(x - 40, y); ctx.lineTo(x - 80, y + 30); ctx.lineTo(x - 30, y + 20);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + 40, y); ctx.lineTo(x + 80, y + 30); ctx.lineTo(x + 30, y + 20);
  ctx.closePath(); ctx.fill();

  // Eye
  ctx.fillStyle = '#ff0';
  ctx.beginPath();
  ctx.ellipse(x, y, 18, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f00';
  ctx.beginPath();
  ctx.arc(x, y, 7, 0, Math.PI * 2);
  ctx.fill();

  // HP bar
  const bw = 160;
  ctx.fillStyle = '#300';
  ctx.fillRect(x - bw/2, y + 55, bw, 8);
  ctx.fillStyle = `hsl(${(b.hp / b.maxHp) * 120}, 100%, 50%)`;
  ctx.fillRect(x - bw/2, y + 55, bw * (b.hp / b.maxHp), 8);
  ctx.strokeStyle = '#f55';
  ctx.lineWidth = 1;
  ctx.strokeRect(x - bw/2, y + 55, bw, 8);

  ctx.shadowBlur = 0;
}

// ── Input ──────────────────────────────────────────────
document.addEventListener('keydown', e => { keys[e.key] = true;  e.preventDefault(); });
document.addEventListener('keyup',   e => { keys[e.key] = false; });
</script>
</body>
</html>
