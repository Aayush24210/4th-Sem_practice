<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style></style>
  <body>
    
    <div style="width:360px;max-width:100%;margin:24px auto;border:1px solid #e0e0e0;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.06);overflow:hidden;font-family:system-ui,sans-serif;">
        <div style="padding:16px;min-height:160px;background:#fff;color:#333;">
            <h3 style="margin:0 0 8px;font-size:16px;">Card Title</h3>
            <p style="margin:0;color:#666;font-size:14px;">This is a simple card. Place content here.</p>
        </div>
        <div style="display:flex;gap:8px;padding:12px;background:#fafafa;border-top:1px solid #eee;">
            <input type="text" placeholder="Type a message..." style="flex:1;padding:8px 10px;border:1px solid #ccc;border-radius:6px;outline:none;" />
            <button style="padding:8px 12px;border:0;background:#0069ff;color:#fff;border-radius:6px;cursor:pointer;">Submit</button>
        </div>
    
    </div>
  </body>
</html>
